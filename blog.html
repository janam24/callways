<style>

  --gold:#D7BD09;
  --gold-dark:#B89F06;
  --navy:#0A182F;
  --navy-2:#132038;
  --ink:#101322;
  --gray:#6B7280;
  --border:#E7E2D4;
  --white:#FFFFFF;

*{

}

html{

  height:100%;
}

body{
  font-family:'Inter',sans-serif;

  color:var(--ink);

main{

}

h1,h2,h3,h4,.btn{

img{
  max-width:100%;

}

a{
  text-decoration:none;
  color:inherit;

.container{
  max-width:1200px;
  margin:0 auto;

}

section{
  padding:88px 0;

@media(max-width:768px){

/* BUTTONS */

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 26px;
  border-radius:var(--radius-full);
  font-weight:600;
  font-size:15px;
  border:2px solid transparent;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  white-space:nowrap;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn svg{
  transition:transform .18s ease;
}

.btn:hover svg{
  transform:translateX(3px);
}

.btn-gold{
  background:var(--gold);
  color:var(--navy);
}

.btn-gold:hover{
  background:var(--gold-dark);
  box-shadow:var(--shadow-md);
}

.btn-outline{
  background:transparent;
  border-color:var(--ink);
  color:var(--ink);
}

.btn-outline:hover{
  background:var(--ink);
  color:var(--white);
}

.btn-navy{
  background:var(--navy);
  color:var(--white);
}

.btn-sm{
  padding:11px 20px;
  font-size:13.5px;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;

  border-bottom:1px solid var(--border);

  justify-content:space-between;
  padding:16px 24px;

  margin:0 auto;
}

.brand img{
  height:32px;
  width:auto;
}

nav.main-nav{
  display:flex;
  gap:34px;
}

nav.main-nav a{
  font-size:14.5px;
  font-weight:500;
  position:relative;
}

nav.main-nav a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-4px;
  width:0;
  height:2px;
  background:var(--gold);
  transition:.2s;
}

nav.main-nav a:hover::after{
  width:100%;
}

.nav-cta{
  display:flex;
  align-items:center;
  gap:18px;
}

.menu-toggle{
  display:none;
  background:none;
  border:none;
  cursor:pointer;
}

@media(max-width:900px){

  nav.main-nav{
    position:fixed;
    top:70px;
    left:0;
    right:0;
    background:#fffdf7;
    flex-direction:column;
    gap:0;
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    border-bottom:1px solid var(--border);
    box-shadow:0 12px 24px rgba(10,24,47,0.10);
    z-index:99;
  }

  nav.main-nav.open{
    max-height:420px;
  }

  nav.main-nav a{
    padding:18px 24px;
    border-top:1px solid #ebe6d8;
    font-size:14.5px;
    background:transparent;
  }

  nav.main-nav a:hover{
    background:rgba(215,189,9,0.06);
  }

  .menu-toggle{
    display:block;
  }

  .nav-cta .btn-gold span{
    display:none;
  }

  .nav-cta .btn-gold{
    padding:12px;
  }

.footer-simple{

.footer-simple-inner{

.footer-simple-links{
  display:flex;
  gap:26px;
  font-size:12px;
  color:var(--navy);
}

.blog-hero{
  padding:56px 0 8px;

.blog-hero .tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:rgba(215,189,9,.12);
  color:var(--gold-dark);
  border-radius:999px;
  padding:7px 14px;
  font-family:'Poppins',sans-serif;

  font-weight:700;

}

.blog-hero h1{
  font-family:'Poppins',sans-serif;
  font-size:clamp(34px,5vw,54px);

  line-height:1.08;
  margin-bottom:16px;

.blog-hero p{

  color:var(--gray);
  max-width:620px;
  line-height:1.6;
}

.blog-list{
  padding:40px 0 88px;

.blog-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

@media(max-width:980px){

    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:640px){
  .blog-grid{
    grid-template-columns:1fr;
  }
}

.blog-card{
  background:var(--white);
  border:1.5px solid var(--border);
  border-radius:var(--radius-lg);
  padding:26px 24px;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease;
  display:flex;
  flex-direction:column;
}

.blog-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-md);
}

.blog-card .date{
  font-size:12.5px;
  color:var(--gold-dark);
  font-weight:700;
  margin-bottom:10px;
}

.blog-card h3{
  font-size:18px;
  font-weight:700;
  line-height:1.3;
  margin-bottom:10px;
}

.blog-card p{
  font-size:13.5px;
  color:var(--gray);
  line-height:1.55;
  flex:1;
}

.blog-card .read-more{

  font-size:13px;

}

.blog-empty, .blog-error{

.blog-error{

}

/* single post view */

}

.post-view.active{

.blog-list.hidden, .blog-hero.hidden{

.post-back{

  font-size:13.5px;
  font-weight:600;

  margin-bottom:26px;

.post-header .date{

.post-header h1{
  font-family:'Poppins',sans-serif;
  font-size:clamp(28px,4vw,42px);
  font-weight:800;
  line-height:1.15;
  margin-bottom:24px;

.post-body{

.post-body p{

.post-body h2, .post-body h3{

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>

<script>

const menuToggle = document.getElementById('menuToggle');
const mainNav = document.getElementById('mainNav');

menuToggle.addEventListener('click', () => {
  mainNav.classList.toggle('open');
});

mainNav.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mainNav.classList.remove('open');
  });
});


/* ===== BLOG LOADING ===== */

const GITHUB_OWNER = 'janam24';
const GITHUB_REPO = 'callways';
const GITHUB_BRANCH = 'main';
const POSTS_PATH = 'posts';

const blogGrid = document.getElementById('blogGrid');
const blogHero = document.getElementById('blogHero');
const blogList = document.getElementById('blogList');
const postView = document.getElementById('postView');
const postBack = document.getElementById('postBack');
const postDate = document.getElementById('postDate');
const postTitle = document.getElementById('postTitle');
const postBody = document.getElementById('postBody');

function parseFrontmatter(raw){
  const match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  if(!match){
    return { data:{}, content: raw };
  }
  const yamlBlock = match[1];
  const content = match[2];
  const data = {};
  const lines = yamlBlock.split('\n');
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    const idx = line.indexOf(':');
    if(idx === -1){ i++; continue; }
    const key = line.slice(0, idx).trim();
    let val = line.slice(idx + 1).trim();

    /* YAML block-scalar values (| or >, optionally with +/-) span the
       following indented lines rather than sitting after the colon. */
    if(/^[|>][+-]?\d*$/.test(val)){
      const blockLines = [];
      i++;
      while(i < lines.length && (lines[i].trim() === '' || /^\s/.test(lines[i]))){
        blockLines.push(lines[i].replace(/^\s+/, ''));
        i++;
      }
      while(blockLines.length && blockLines[blockLines.length - 1] === ''){
        blockLines.pop();
      }
      data[key] = blockLines.join(val.startsWith('>') ? ' ' : '\n').trim();
      continue;
    }

    val = val.replace(/^["']|["']$/g, '');
    data[key] = val;
    i++;
  }
  return { data, content };
}

function formatDate(d){
  if(!d) return '';
  const dateObj = new Date(d);
  if(isNaN(dateObj)) return d;
  return dateObj.toLocaleDateString('de-DE', { day:'2-digit', month:'long', year:'numeric' });
}

async function loadPosts(){
  try{
    const listUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${POSTS_PATH}?ref=${GITHUB_BRANCH}`;
    const listRes = await fetch(listUrl);
    if(!listRes.ok) throw new Error('Liste konnte nicht geladen werden');
    const files = await listRes.json();
    const mdFiles = files.filter(f => f.name.endsWith('.md'));

    if(mdFiles.length === 0){
      blogGrid.innerHTML = '<div class="blog-empty">Noch keine Beiträge veröffentlicht.</div>';
      return;
    }

    const posts = await Promise.all(mdFiles.map(async f => {
      const rawRes = await fetch(f.download_url);
      const raw = await rawRes.text();
      const { data, content } = parseFrontmatter(raw);
      return {
        slug: f.name.replace(/\.md$/, ''),
        title: data.title || f.name,
        date: data.date || '',
        excerpt: data.excerpt || '',
        content
      };
    }));

    posts.sort((a, b) => new Date(b.date) - new Date(a.date));

    blogGrid.innerHTML = '';
    posts.forEach(post => {
      const card = document.createElement('div');
      card.className = 'blog-card';
      card.innerHTML = `
        <div class="date">${formatDate(post.date)}</div>
        <h3>${post.title}</h3>
        <p>${post.excerpt}</p>
        <div class="read-more">Weiterlesen &rarr;</div>
      `;
      card.addEventListener('click', () => showPost(post));
      blogGrid.appendChild(card);
    });

  }catch(err){
    blogGrid.innerHTML = '<div class="blog-error">Beiträge konnten nicht geladen werden. Bitte später erneut versuchen.</div>';
    console.error(err);
  }
}

function showPost(post){
  postDate.textContent = formatDate(post.date);
  postTitle.textContent = post.title;
  postBody.innerHTML = (typeof marked !== 'undefined') ? marked.parse(post.content) : post.content;
  blogHero.classList.add('hidden');
  blogList.classList.add('hidden');
  postView.classList.add('active');
  window.scrollTo({ top:0, behavior:'instant' });
}

postBack.addEventListener('click', () => {
  postView.classList.remove('active');
  blogHero.classList.remove('hidden');
  blogList.classList.remove('hidden');
});

loadPosts();

</script>
