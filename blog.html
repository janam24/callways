<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Callways – Kundenservice, der immer erreichbar ist.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --cream:#FCFAF2;
  --gold:#D7BD09;
  --gold-dark:#B89F06;
  --navy:#0A182F;
  --navy-2:#132038;
  --ink:#101322;
  --gray:#6B7280;
  --border:#E7E2D4;
  --white:#FFFFFF;
  --radius-lg:20px;
  --radius-full:999px;
  --shadow-md:0 10px 30px rgba(10,24,47,0.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4,.btn{
  font-family:'Poppins',sans-serif;
}

img{
  max-width:100%;
  display:block;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  max-width:1200px;
  margin:0 auto;
  padding:0 24px;
}

section{
  padding:88px 0;
}

@media(max-width:768px){
  section{
    padding:56px 0;
  }
}


/* BUTTONS */

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 26px;
  border-radius:var(--radius-full);
  font-weight:600;
  font-size:15px;
  border:2px solid transparent;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  white-space:nowrap;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn svg{
  transition:transform .18s ease;
}

.btn:hover svg{
  transform:translateX(3px);
}

.btn-gold{
  background:var(--gold);
  color:var(--navy);
}

.btn-gold:hover{
  background:var(--gold-dark);
  box-shadow:var(--shadow-md);
}

.btn-outline{
  background:transparent;
  border-color:var(--ink);
  color:var(--ink);
}

.btn-outline:hover{
  background:var(--ink);
  color:var(--white);
}

.btn-navy{
  background:var(--navy);
  color:var(--white);
}

.btn-sm{
  padding:11px 20px;
  font-size:13.5px;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(252,250,242,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}

.nav-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 24px;
  max-width:1200px;
  margin:0 auto;
}

.brand img{
  height:32px;
  width:auto;
}

nav.main-nav{
  display:flex;
  gap:34px;
}

nav.main-nav a{
  font-size:14.5px;
  font-weight:500;
  position:relative;
}

nav.main-nav a::after{
  content:'';
  position:absolute;
  left:0;
  bottom:-4px;
  width:0;
  height:2px;
  background:var(--gold);
  transition:.2s;
}

nav.main-nav a:hover::after{
  width:100%;
}

.nav-cta{
  display:flex;
  align-items:center;
  gap:18px;
}

.menu-toggle{
  display:none;
  background:none;
  border:none;
  cursor:pointer;
}

@media(max-width:900px){

  nav.main-nav{
    position:fixed;
    top:70px;
    left:0;
    right:0;
    background:#fffdf7;
    flex-direction:column;
    gap:0;
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    border-bottom:1px solid var(--border);
    box-shadow:0 12px 24px rgba(10,24,47,0.10);
    z-index:99;
  }

  nav.main-nav.open{
    max-height:420px;
  }

  nav.main-nav a{
    padding:18px 24px;
    border-top:1px solid #ebe6d8;
    font-size:14.5px;
    background:transparent;
  }

  nav.main-nav a:hover{
    background:rgba(215,189,9,0.06);
  }

  .menu-toggle{
    display:block;
  }

  .nav-cta .btn-gold span{
    display:none;
  }

  .nav-cta .btn-gold{
    padding:12px;
  }
}


/* HERO */

.hero{
  padding:56px 0 28px;
  overflow:hidden;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr 1fr;
  gap:40px;
  align-items:center;
}

.hero h1{
  font-size:clamp(34px,5vw,54px);
  font-weight:800;
  line-height:1.08;
  margin-bottom:20px;
}

.hero h1 .accent{
  color:var(--gold);
}

.hero p.lead{
  font-size:16.5px;
  color:var(--gray);
  max-width:500px;
  margin-bottom:30px;
  line-height:1.55;
}

.hero-actions{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:42px;
}


/* HERO STATS - FIXED: equal columns, consistent alignment, long words wrap */

.hero-stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
  width:100%;
  max-width:650px;
}

.hero-stat{
  display:flex;
  align-items:flex-start;
  gap:10px;
  min-width:0;
}

.hero-stat-icon{
  width:38px;
  height:38px;
  border:1.5px solid var(--border);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-dark);
  flex-shrink:0;
}

.hero-stat-icon svg{
  width:17px;
  height:17px;
}

.hero-stat-text{
  min-width:0;
  flex:1;
}

.hero-stat b{
  display:block;
  font-family:'Poppins',sans-serif;
  font-size:15px;
  font-weight:700;
  margin-bottom:4px;
  line-height:1.2;
}

.hero-stat span{
  display:block;
  font-size:11.5px;
  line-height:1.35;
  color:var(--gray);
  overflow-wrap:break-word;
  hyphens:auto;
}

@media(max-width:1100px){
  .hero-stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    max-width:520px;
    gap:24px 30px;
  }
}

@media(max-width:520px){
  .hero-stats{
    grid-template-columns:minmax(0,1fr);
  }
}


/* HERO IMAGE */

.hero-art{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:420px;
}

.giraffe-wrap{
  position:relative;
  z-index:1;
  width:90%;
  animation:giraffefloat 5s ease-in-out infinite;
}

.giraffe-img{
  width:100%;
  filter:drop-shadow(0 18px 30px rgba(10,24,47,0.18));
}

@keyframes giraffefloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.float-icon{
  position:absolute;
  z-index:2;
  color:var(--gold-dark);
}

.float-icon.sparkle{top:6%;left:6%;width:30px;}
.float-icon.chat{top:20%;left:0;width:26px;}
.float-icon.phone{bottom:14%;left:2%;width:24px;}
.float-icon.mail{bottom:0;left:38%;width:22px;}

.speech-bubble{
  position:absolute;
  top:8%;
  right:-2%;
  background:var(--white);
  border-radius:16px 16px 16px 4px;
  padding:14px 18px;
  box-shadow:var(--shadow-md);
  font-size:12.5px;
  font-weight:600;
  z-index:2;
}

.speech-bubble div:last-child{
  color:var(--gold-dark);
}

@media(max-width:900px){

  .hero-grid{
    grid-template-columns:1fr;
    text-align:center;
  }

  .hero-actions{
    justify-content:center;
  }

  .hero-stats{
    margin:0 auto;
    text-align:left;
  }

  .hero-art{
    margin-top:20px;
  }
}


/* SERVICES */

.section-head{
  margin-bottom:42px;
}

.section-head h2{
  font-size:clamp(26px,3.4vw,34px);
  font-weight:800;
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  background:var(--white);
  border:1.5px solid var(--border);
  border-radius:var(--radius-lg);
  padding:28px 24px;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-md);
}

.card-head{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.card-icon{
  width:46px;
  height:46px;
  background:rgba(215,189,9,0.14);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-dark);
  flex-shrink:0;
}

.card-icon svg{
  width:22px;
  height:22px;
}

.card h3{
  font-size:16px;
  font-weight:700;
  margin:0;
  line-height:1.3;
}

.card p{
  font-size:13.5px;
  color:var(--gray);
  line-height:1.55;
}

.card-dark{
  background:var(--navy);
  color:var(--white);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card-dark .card-icon{
  background:var(--gold);
  color:var(--navy);
}

.card-dark p{
  color:#B9C1D4;
}

.card-dark .discover{
  color:var(--gold);
  margin-top:14px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:13.5px;
  font-weight:600;
}

@media(max-width:980px){
  .services-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:560px){
  .services-grid{
    grid-template-columns:1fr;
  }
}


/* INDUSTRIES */

.industries{
  background:var(--navy);
  color:var(--white);
  padding:64px 0;
}

.industries-inner{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:48px;
  align-items:center;
}

.industries h2{
  font-size:clamp(24px,3vw,30px);
  font-weight:800;
  line-height:1.15;
}

.industries-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:28px;
}

.industry-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  font-size:14px;
  font-weight:600;
  color:#E4E8EF;
  text-align:center;
}

.industry-item svg{
  width:34px;
  height:34px;
  color:var(--gold);
}

@media(max-width:900px){

  .industries-inner{
    grid-template-columns:1fr;
  }

  .industries h2{
    text-align:center;
  }

  .industries-list{
    grid-template-columns:repeat(2,1fr);
  }
}


/* CTA */

.cta-band{
  background:var(--gold);
  padding:34px 0;
}

.cta-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
}

.cta-inner h2{
  font-size:clamp(22px,3vw,28px);
  font-weight:800;
  margin-bottom:6px;
}

.cta-inner p{
  font-size:14px;
}

.cta-contacts{
  display:flex;
  align-items:center;
  gap:26px;
}

.cta-contact{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
}

.cta-contact-icon{
  width:34px;
  height:34px;
  border:1.5px solid rgba(10,24,47,.35);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cta-contact-icon svg{
  width:15px;
  height:15px;
}


.cta-appointment{
  background:var(--cream);
  color:var(--navy);
  border:2px solid var(--navy);
  padding:11px 18px;
  font-size:13.5px;
}

.cta-appointment:hover{
  background:var(--navy);
  color:var(--white);
  box-shadow:var(--shadow-md);
}


@media(max-width:900px){

  .cta-inner{
    flex-wrap:wrap;
  }

  .cta-contacts{
    flex-wrap:wrap;
  }
}


/* FOOTER */

.site-footer{
  background:var(--cream);
}

.footer-simple{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.footer-simple-inner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:26px;
}

.footer-simple-logo img{
  height:32px;
}

.footer-simple-links{
  display:flex;
  gap:26px;
  font-size:12px;
  color:var(--navy);
}

</style>

<style>

<style>
/* Hero buttons: exakt gleiche Höhe */

  height:56px !important;
  min-height:56px !important;
  padding-top:0 !important;
  padding-bottom:0 !important;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
}
</style>


<style>
/* Hero CTA buttons: exakt gleiche Größe auf Desktop und Mobile */

  width:240px !important;
  height:56px !important;
  min-width:240px !important;

  display:inline-flex !important;

}

</head>

<body>

<header>

<div class="nav-wrap">

<a href="index.html" class="brand">

</div>

<script>

const menuToggle = document.getElementById('menuToggle');
const mainNav = document.getElementById('mainNav');

menuToggle.addEventListener('click', () => {
  mainNav.classList.toggle('open');
});

mainNav.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mainNav.classList.remove('open');
  });
});

</script>
